<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tarjeta de perfil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="tarjeta">
    <img class="tarjeta__foto" src="img/foto.jpg" alt="Foto de perfil" />
    <h2 class="tarjeta__nombre">Luis Torres</h2>
    <p class="tarjeta__rol">Desarrollador Front-End</p>
    <p class="tarjeta__descripcion">
      Apasionado por crear interfaces limpias y accesibles usando HTML, CSS3 y JavaScript.
    </p>
    <button class="tarjeta__boton">Ver perfil</button>
  </div>
</body>
</html>
