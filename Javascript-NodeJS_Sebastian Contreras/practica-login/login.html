<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Login - JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <p>Introduce tus credenciales para validar seguridad</p>

        <!-- Formulario simulado -->
        <div class="input-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" value="estudiante@uadec.edu.mx">
        </div>

        <div class="input-group">
            <label for="password">Contraseña:</label>
            <input type="text" id="password" placeholder="Escribe tu contraseña aquí">
        </div>

        <button id="btnLogin">Validar y Entrar</button>

        <div id="resultado" class="oculto"></div>
    </div>

    <!-- Vinculamos el archivo JavaScript externo al final del body -->
    <script src="script.js"></script>
</body>
</html>
